<main class="page-shell">
  <section class="hero"><h1>SHA 哈希计算器</h1><p>计算文本或本地文件的 SHA-256、SHA-384 和 SHA-512 哈希值。</p></section>
  <section class="tool-card"><p class="local-processing-note">文本和文件仅在本地进行哈希计算，绝不会上传。</p><div class="field"><label for="hashAlgorithm">算法</label><select id="hashAlgorithm"><option>SHA-256</option><option>SHA-384</option><option>SHA-512</option></select></div><div class="grid-2"><div><div class="field"><label for="hashText">文本输入</label><textarea id="hashText" placeholder="输入要计算哈希的文本"></textarea></div><button id="hashTextButton">计算文本哈希</button></div><div><div class="field"><span class="field-label">文件输入（本地处理）</span><div class="file-picker-row"><input id="hashFile" class="file-input-native" type="file" aria-describedby="hashFileName"><label class="file-picker-button button-link secondary" for="hashFile">选择文件</label><span id="hashFileName" class="file-picker-name">尚未选择文件</span></div></div><button id="hashFileButton">计算文件哈希</button></div></div><div class="field"><label for="hashOutput">计算出的哈希值</label><textarea id="hashOutput" class="output" readonly></textarea></div><div class="field"><label for="expectedHash">预期哈希值（可选）</label><input id="expectedHash" type="text" spellcheck="false" placeholder="粘贴哈希值进行比较"></div><div class="actions"><button id="compareHash">比较哈希值</button><button id="copyHash" class="secondary">复制结果</button></div><div id="hashStatus" class="status" role="status">就绪</div></section><aside class="info-card"><strong>隐私：</strong>所选文件绝不会离开您的设备。由于 Web Crypto 会对内存缓冲区进行哈希计算，文件大小上限为 32 MiB。</aside>
</main>
