<body class="tool-directory-page">
<header class="site-header"><nav class="nav-shell" aria-label="主导航"><div class="brand-cluster"><a class="brand" href="/zh/"><img src="/images/logo.svg" alt="UtilCover" width="178" height="44"></a><span class="nav-trust">仅在本地处理，不会上传</span></div><div class="nav-links"><a href="/zh/password/">密码</a><a href="/zh/calculator/">计算器</a><a href="/zh/json/">JSON</a><a href="/zh/text/">文本</a><a href="/zh/encode/">编解码</a><a href="/zh/timestamp/" aria-current="page">时间戳</a><a href="/zh/uuid/">UUID</a><a href="/zh/hash/">哈希</a><a href="/zh/qr/">二维码</a><a href="/zh/unit/">单位</a><a href="/zh/color/">颜色</a><a href="/zh/image/">图片</a><a class="language-link" href="/timestamp/?lang=en">英文</a></div></nav></header>
<main class="page-shell">
  <section class="hero"><h1>Unix 时间戳转换器</h1><p>转换 Unix 秒、毫秒、本地日期时间和 ISO 8601 UTC 时间。</p></section>
  <section class="tool-card"><div class="grid-2"><div class="field"><label for="unixInput">Unix 时间戳</label><input id="unixInput" type="text" inputmode="decimal"><select id="unixUnit" aria-label="时间戳单位"><option value="auto">自动检测（现代日期）</option><option value="seconds">秒</option><option value="milliseconds">毫秒</option></select><button id="convertUnix">转换时间戳</button></div><div class="field"><label for="dateInput">本地日期和时间</label><input id="dateInput" type="datetime-local"><button id="convertDate">转换日期</button></div></div><div class="actions"><button id="useCurrentTime" class="secondary">使用当前时间</button><span class="status">时区：<strong id="currentTimezone"></strong></span></div><div class="result-grid"><div class="result-item"><span>Unix 秒</span><code id="resultSeconds">—</code><button class="secondary" data-copy-target="resultSeconds">复制</button></div><div class="result-item"><span>Unix 毫秒</span><code id="resultMilliseconds">—</code><button class="secondary" data-copy-target="resultMilliseconds">复制</button></div><div class="result-item"><span>ISO 8601 / UTC</span><code id="resultIso">—</code><button class="secondary" data-copy-target="resultIso">复制</button></div><div class="result-item"><span>本地时间</span><code id="resultLocal">—</code><button class="secondary" data-copy-target="resultLocal">复制</button></div></div><div id="timestampStatus" class="status" role="status">就绪</div></section>
</main>
