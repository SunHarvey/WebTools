  <section class="tool-card"><p class="local-processing-note">您的文本仅保留在当前浏览器中，绝不会上传。</p><div class="field"><label for="textInput">文本</label><textarea id="textInput" placeholder="在此粘贴或输入文本"></textarea></div><div class="stat-grid"><div class="stat"><strong data-stat="characters">0</strong><span>字符</span></div><div class="stat"><strong data-stat="charactersNoSpaces">0</strong><span>不含空格</span></div><div class="stat"><strong data-stat="words">0</strong><span>单词</span></div><div class="stat"><strong data-stat="chineseCharacters">0</strong><span>中文字符</span></div><div class="stat"><strong data-stat="lines">0</strong><span>行</span></div><div class="stat"><strong data-stat="paragraphs">0</strong><span>段落</span></div></div><div class="actions"><button data-text-action="trim">清理行首尾空格</button><button data-text-action="blanks" class="secondary">删除空白行</button><button data-text-action="dedupe" class="secondary">删除重复行</button><button data-text-action="sort" class="secondary">行排序</button><button data-text-action="upper" class="secondary">转为大写</button><button data-text-action="lower" class="secondary">转为小写</button><button data-text-action="title" class="secondary">转为标题格式</button><button id="copyText" class="secondary">复制</button><button id="clearText" class="danger">清空</button></div><div id="textStatus" class="status" role="status">就绪</div></section>
