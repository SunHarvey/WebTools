<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/images/favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/images/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#08111f">
  <title>图片压缩与尺寸调整 | UtilCover</title>
  <meta name="description" content="在浏览器本地私密地压缩 PNG、JPEG 和 WebP 图片并调整尺寸。">
  <link rel="canonical" href="https://www.utilcover.com/zh/image/">
  <link rel="alternate" hreflang="en" href="https://www.utilcover.com/image/">
  <link rel="alternate" hreflang="zh-CN" href="https://www.utilcover.com/zh/image/">
  <link rel="alternate" hreflang="x-default" href="https://www.utilcover.com/image/">
  <link rel="stylesheet" href="/shared/tools.css">
  <link rel="stylesheet" href="/image/image-tool.css">
</head>
<body class="tool-directory-page">
<header class="site-header"><nav class="nav-shell" aria-label="主导航"><a class="brand" href="/zh/"><img src="/images/logo.svg" alt="UtilCover" width="178" height="44"></a><div class="nav-links"><a href="/zh/password/">密码</a><a href="/zh/calculator/">计算器</a><a href="/zh/json/">JSON</a><a href="/zh/text/">文本</a><a href="/zh/encode/">编解码</a><a href="/zh/timestamp/">时间戳</a><a href="/zh/uuid/">UUID</a><a href="/zh/hash/">哈希</a><a href="/zh/qr/">二维码</a><a href="/zh/unit/">单位</a><a href="/zh/color/">颜色</a><a href="/zh/image/" aria-current="page">图片</a><a class="language-link" href="/image/?lang=en">英文</a></div></nav></header>
<main class="page-shell">
  <section class="hero">
    <h1>图片压缩与尺寸调整</h1>
    <p>无需上传图片，即可在浏览器本地缩放和转换 PNG、JPEG 或 WebP 图片。</p>
  </section>
  <section class="tool-card"><p class="local-processing-note">图片仅在本设备上处理，绝不会上传。</p>
    <div class="field">
      <span class="field-label">图片文件</span>
      <div class="file-picker-row"><input id="imageFile" class="file-input-native" type="file" accept="image/png,image/jpeg,image/webp" aria-describedby="imageFileName"><label class="file-picker-button button-link secondary" for="imageFile">选择文件</label><span id="imageFileName" class="file-picker-name">尚未选择图片</span></div>
      <small>仅支持 PNG、JPEG 或 WebP；最大 16 MiB / 1200 万像素</small>
    </div>
    <div class="preview-grid" aria-live="polite">
      <article class="preview-panel">
        <h2>原图</h2>
        <div class="preview-frame"><img id="originalPreview" alt="原图预览" hidden></div>
        <p id="originalInfo">尚未选择图片</p>
      </article>
      <article class="preview-panel">
        <h2>结果</h2>
        <div class="preview-frame"><img id="resultPreview" alt="压缩后图片预览" hidden></div>
        <p id="resultInfo">尚无结果</p>
      </article>
    </div>
    <div class="settings-grid">
      <div class="field"><label for="targetWidth">宽度</label><input id="targetWidth" type="number" min="1" max="8192" value="1" inputmode="numeric"></div>
      <div class="field"><label for="targetHeight">高度</label><input id="targetHeight" type="number" min="1" max="8192" value="1" inputmode="numeric"></div>
      <div class="field"><label for="outputFormat">输出格式</label><select id="outputFormat"><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></div>
      <div class="field" id="qualityField"><label for="quality">质量 <output id="qualityValue">80%</output></label><input id="quality" type="range" min="1" max="100" value="80"></div>
    </div>
    <div class="checkbox-row options">
      <label><input id="keepAspect" type="checkbox" checked> 保持宽高比</label>
      <label><input id="preventUpscale" type="checkbox" checked> 不放大图片</label>
    </div>
    <div class="actions">
      <button id="compressButton" disabled>压缩并调整尺寸</button>
      <a id="downloadLink" class="button-link secondary" hidden>下载结果</a>
    </div>
    <div id="imageStatus" class="status" role="status">就绪 — 请选择图片</div>
  </section>
  <aside class="info-card"><strong>隐私：</strong>所有 Canvas 处理都在本设备上完成，文件绝不会上传。工具会拒绝 SVG 和动态 GIF。</aside>
</main>
<footer>UtilCover · 私密、快速的浏览器本地工具</footer>
<script src="/image/image-tool.js"></script>
</body>
</html>
